<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adig Mascot — Sad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        svg { shape-rendering: geometricPrecision; }
        .mascot-container { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div class="min-h-screen flex flex-col items-center justify-center relative bg-[#f7fbed] font-sans text-[#2c2e2a] overflow-hidden" data-sd-id="1">

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[560px] h-[560px] bg-[#8ed462]/10 rounded-full blur-[110px] -z-10 pointer-events-none" data-sd-id="2"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[60%] w-[260px] h-[260px] bg-[#3b82f6]/8 rounded-full blur-[90px] -z-10 pointer-events-none" data-sd-id="3"></div>

        <div class="text-center mb-10 z-10" data-sd-id="4">
            <p class="text-xs font-bold uppercase tracking-[0.14em] text-[#4a7a2e] mb-2" data-sd-id="11">Sad</p>
            <h1 class="text-4xl md:text-5xl font-bold text-[#2c2e2a] mb-3 tracking-tight" data-sd-id="5">Adig <span class="text-[#ef4444]" data-sd-id="6">Mascot</span></h1>
            <p class="text-base text-[#5f6157] max-w-md mx-auto" data-sd-id="7">Concern — something doesn't look right, or we couldn't help this time. Here with you anyway.</p>
        </div>

        <div id="mascot-wrapper" class="mascot-container relative z-20" data-sd-id="8">
            <svg id="mascot-svg" width="280" height="360" viewBox="0 0 280 360" fill="none" xmlns="http://www.w3.org/2000/svg" data-sd-id="9">
                <defs>
                    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                    </filter>
                    <filter id="body-shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <fedropshadow dx="0" dy="8" stdDeviation="12" flood-color="#4a7a2e" flood-opacity="0.15"></fedropshadow>
                    </filter>
                    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#9bdb68"></stop>
                        <stop offset="100%" stop-color="#79c247"></stop>
                    </linearGradient>
                    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fde047"></stop>
                        <stop offset="100%" stop-color="#eab308"></stop>
                    </linearGradient>
                </defs>

                <g id="mascot-body-group" filter="url(#body-shadow)">
                    <!-- Cape hangs limp -->
                    <path id="cape" d="M84 122 L62 278 Q 140 292 218 278 L196 122 Z" fill="#ef4444" opacity="0.78"></path>

                    <!-- Left arm hanging down -->
                    <g id="arm-left">
                        <rect x="94" y="160" width="22" height="74" rx="11" fill="#6fb843" transform="rotate(6 105 160)"></rect>
                        <circle cx="102" cy="238" r="13" fill="#f4c542"></circle>
                    </g>

                    <rect x="100" y="140" width="80" height="120" rx="30" fill="url(#suit-grad)" stroke="#4a7a2e" stroke-width="2"></rect>

                    <circle cx="140" cy="185" r="20" fill="#4a7a2e" opacity="0.5"></circle>
                    <path d="M135 175 L145 175 L140 185 L148 185 L135 198 L138 188 L130 188 Z" fill="#fde047" opacity="0.85"></path>

                    <rect x="115" y="240" width="20" height="60" rx="10" fill="#2563eb"></rect>
                    <rect x="145" y="240" width="20" height="60" rx="10" fill="#2563eb"></rect>
                    <path d="M110 290 h30 a10 10 0 0 1 10 10 v0 a0 0 0 0 1 0 0 h-40 a0 0 0 0 1 0 0 v-10 a10 10 0 0 1 10 -10 z" fill="#f4c542"></path>
                    <path d="M140 290 h30 a10 10 0 0 1 10 10 v0 a0 0 0 0 1 0 0 h-40 a0 0 0 0 1 0 0 v-10 a10 10 0 0 1 10 -10 z" fill="#f4c542"></path>

                    <!-- Head tilts down slightly -->
                    <g id="head-group" transform="rotate(-6 140 138)">
                        <circle cx="140" cy="100" r="45" fill="#8ed462"></circle>
                        <circle cx="140" cy="100" r="38" fill="#fffdf5"></circle>
                        <!-- worried brows (inner-up) -->
                        <path d="M119 90 L131 87" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round"></path>
                        <path d="M161 90 L149 87" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round"></path>
                        <circle id="eye-left" cx="126" cy="98" r="4.6" fill="#2c2e2a"></circle>
                        <circle id="eye-right" cx="154" cy="98" r="4.6" fill="#2c2e2a"></circle>
                        <!-- single tear -->
                        <path id="tear" d="M126 104 q4 6 0 9 q-4 -3 0 -9 Z" fill="#3b82f6" opacity="0"></path>
                        <circle cx="116" cy="109" r="5.5" fill="#ef4444" opacity="0.3"></circle>
                        <circle cx="164" cy="109" r="5.5" fill="#ef4444" opacity="0.3"></circle>
                        <!-- downturned mouth -->
                        <path id="mouth" d="M130 116 Q 140 108 150 116" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round" fill="none"></path>
                    </g>
                </g>

                <!-- Right arm lowered, bolt held down and dimmed -->
                <g id="arm-right" transform-origin="160 160">
                    <rect x="160" y="152" width="22" height="76" rx="11" fill="#7cc44f" transform="rotate(-14 160 152)"></rect>
                    <circle cx="188" cy="222" r="14" fill="#f4c542"></circle>
                    <g id="the-bolt" filter="url(#bolt-glow)" opacity="0.55">
                        <path d="M196 196 L184 220 h12 L182 250 L206 216 h-12 L202 196 Z" fill="url(#bolt-grad)"></path>
                    </g>
                </g>
            </svg>
        </div>

        <div id="status-text" class="mt-8 text-sm font-medium text-[#4a7a2e] opacity-0 transition-opacity duration-300" data-sd-id="10">
            We'll figure this out.
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wrapper = document.getElementById('mascot-wrapper');
            const svg = document.getElementById('mascot-svg');
            const bodyGroup = document.getElementById('mascot-body-group');
            const rightArm = document.getElementById('arm-right');
            const bolt = document.getElementById('the-bolt');
            const cape = document.getElementById('cape');
            const headGroup = document.getElementById('head-group');
            const tear = document.getElementById('tear');
            const eyeLeft = document.getElementById('eye-left');
            const eyeRight = document.getElementById('eye-right');
            const statusText = document.getElementById('status-text');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            gsap.set(wrapper, { transformOrigin: "center bottom" });
            gsap.set(rightArm, { transformOrigin: "30% 20%" });
            gsap.set(bodyGroup, { transformOrigin: "50% 100%" });
            gsap.set(cape, { transformOrigin: "140px 122px" });
            gsap.set(headGroup, { transformOrigin: "140px 140px" });
            gsap.set([eyeLeft, eyeRight], { transformOrigin: "center center" });

            function startAmbient() {
                if (reduceMotion) return;
                // Slow, heavy breathing float — the weight of the situation.
                gsap.to(svg, { y: -5, duration: 3, ease: "sine.inOut", yoyo: true, repeat: -1 });
                gsap.to(bodyGroup, { scale: 1.01, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
                gsap.to(cape, { rotation: 1.5, skewX: -1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: -1, delay: 0.3 });
                // The dimmed bolt flickers faintly, low energy.
                gsap.to(bolt, { opacity: 0.4, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: -1 });
                scheduleBlink();
                gsap.delayedCall(2.5, dropTear);
            }
            function dropTear() {
                if (reduceMotion) return;
                gsap.fromTo(tear, { opacity: 0, y: 0 }, {
                    opacity: 0.85, y: 0, duration: 0.3, ease: "power1.in",
                    onComplete: () => gsap.to(tear, { y: 14, opacity: 0, duration: 0.9, ease: "power1.in",
                        onComplete: () => { gsap.set(tear, { y: 0 }); gsap.delayedCall(gsap.utils.random(4, 7), dropTear); } })
                });
            }
            function scheduleBlink() {
                if (reduceMotion) return;
                gsap.to([eyeLeft, eyeRight], { scaleY: 0.1, duration: 0.1, ease: "power1.inOut",
                    yoyo: true, repeat: 1, delay: gsap.utils.random(3, 6), onComplete: scheduleBlink });
            }

            if (reduceMotion) {
                gsap.set(wrapper, { scale: 1, y: 0, opacity: 1 });
                gsap.to(statusText, { opacity: 1, duration: 0.3 });
                startAmbient();
            } else {
                gsap.from(wrapper, { duration: 1.2, scale: 0.6, y: 30, opacity: 0, ease: "power2.out", delay: 0.25,
                    onComplete: () => { startAmbient(); gsap.to(statusText, { opacity: 1, duration: 0.5 }); } });
            }

            // Hover = a gentle reassurance: perks up just a little.
            wrapper.addEventListener('mouseenter', () => {
                gsap.to(wrapper, { scale: 1.05, duration: 0.4, ease: "power2.out" });
                gsap.to(headGroup, { rotation: 0, duration: 0.5, ease: "power2.out" });
                gsap.to(bolt, { opacity: 0.8, duration: 0.4 });
                statusText.innerText = "You're not alone in this.";
                statusText.classList.add('text-[#ef4444]'); statusText.classList.remove('text-[#4a7a2e]');
            });
            wrapper.addEventListener('mouseleave', () => {
                gsap.to(wrapper, { scale: 1, duration: 0.4, ease: "power2.out" });
                gsap.to(headGroup, { rotation: -6, duration: 0.6, ease: "power2.inOut" });
                statusText.innerText = "We'll figure this out.";
                statusText.classList.remove('text-[#ef4444]'); statusText.classList.add('text-[#4a7a2e]');
            });

            // Click = a small empathetic shrug (no celebration — stays in character).
            wrapper.addEventListener('click', () => {
                if (gsap.isTweening(bodyGroup)) return;
                const tl = gsap.timeline();
                tl.to(bodyGroup, { rotation: -3, duration: 0.18, ease: "power1.inOut" })
                  .to(bodyGroup, { rotation: 3, duration: 0.24, ease: "power1.inOut" })
                  .to(bodyGroup, { rotation: 0, duration: 0.4, ease: "elastic.out(1, 0.5)" });
                gsap.to(rightArm, { keyframes: [
                    { rotation: -8, duration: 0.2, ease: "power1.out" },
                    { rotation: 0, duration: 0.4, ease: "elastic.out(1, 0.5)" }
                ]});
                statusText.innerText = "Let's see what we can still do.";
                gsap.delayedCall(2.2, () => { statusText.innerText = "We'll figure this out."; });
            });
        });
    </script>
</body></html>
