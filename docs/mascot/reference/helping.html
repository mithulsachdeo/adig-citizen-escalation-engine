<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adig Mascot — Helping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        svg { shape-rendering: geometricPrecision; }
        .mascot-container { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div class="min-h-screen flex flex-col items-center justify-center relative bg-[#f7fbed] font-sans text-[#2c2e2a] overflow-hidden" data-sd-id="1">

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#8ed462]/16 rounded-full blur-[110px] -z-10 pointer-events-none" data-sd-id="2"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[62%] w-[300px] h-[300px] bg-[#f4c542]/12 rounded-full blur-[90px] -z-10 pointer-events-none" data-sd-id="3"></div>

        <div class="text-center mb-10 z-10" data-sd-id="4">
            <p class="text-xs font-bold uppercase tracking-[0.14em] text-[#4a7a2e] mb-2" data-sd-id="11">Helping</p>
            <h1 class="text-4xl md:text-5xl font-bold text-[#2c2e2a] mb-3 tracking-tight" data-sd-id="5">Adig <span class="text-[#ef4444]" data-sd-id="6">Mascot</span></h1>
            <p class="text-base text-[#5f6157] max-w-md mx-auto" data-sd-id="7">Rallying — you were overcharged. Charging up to fight it with you.</p>
        </div>

        <div id="mascot-wrapper" class="mascot-container relative z-20" data-sd-id="8">
            <svg id="mascot-svg" width="280" height="360" viewBox="0 0 280 360" fill="none" xmlns="http://www.w3.org/2000/svg" data-sd-id="9">
                <defs>
                    <filter id="bolt-glow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                    </filter>
                    <filter id="body-shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <fedropshadow dx="0" dy="10" stdDeviation="14" flood-color="#4a7a2e" flood-opacity="0.18"></fedropshadow>
                    </filter>
                    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#9bdb68"></stop>
                        <stop offset="100%" stop-color="#79c247"></stop>
                    </linearGradient>
                    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fde047"></stop>
                        <stop offset="100%" stop-color="#eab308"></stop>
                    </linearGradient>
                </defs>

                <g id="mascot-body-group" filter="url(#body-shadow)">
                    <path id="cape" d="M80 120 L50 280 Q 140 300 230 280 L200 120 Z" fill="#ef4444" opacity="0.92"></path>

                    <!-- Left arm on hip (determined stance) -->
                    <g id="arm-left">
                        <rect x="92" y="158" width="22" height="60" rx="11" fill="#6fb843" transform="rotate(46 103 160)"></rect>
                        <circle cx="118" cy="196" r="13" fill="#f4c542"></circle>
                    </g>

                    <rect x="100" y="140" width="80" height="120" rx="30" fill="url(#suit-grad)" stroke="#4a7a2e" stroke-width="2"></rect>

                    <circle cx="140" cy="185" r="20" fill="#4a7a2e" opacity="0.55"></circle>
                    <path d="M135 175 L145 175 L140 185 L148 185 L135 198 L138 188 L130 188 Z" fill="#fde047"></path>

                    <rect x="115" y="240" width="20" height="60" rx="10" fill="#2563eb"></rect>
                    <rect x="145" y="240" width="20" height="60" rx="10" fill="#2563eb"></rect>
                    <path d="M110 290 h30 a10 10 0 0 1 10 10 v0 a0 0 0 0 1 0 0 h-40 a0 0 0 0 1 0 0 v-10 a10 10 0 0 1 10 -10 z" fill="#f4c542"></path>
                    <path d="M140 290 h30 a10 10 0 0 1 10 10 v0 a0 0 0 0 1 0 0 h-40 a0 0 0 0 1 0 0 v-10 a10 10 0 0 1 10 -10 z" fill="#f4c542"></path>

                    <g id="head-group">
                        <circle cx="140" cy="100" r="45" fill="#8ed462"></circle>
                        <circle cx="140" cy="100" r="38" fill="#fffdf5"></circle>
                        <!-- determined brows -->
                        <path d="M118 86 L131 90" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round"></path>
                        <path d="M162 86 L149 90" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round"></path>
                        <circle id="eye-left" cx="125" cy="97" r="5" fill="#2c2e2a"></circle>
                        <circle id="eye-right" cx="155" cy="97" r="5" fill="#2c2e2a"></circle>
                        <circle cx="115" cy="108" r="6" fill="#ef4444" opacity="0.35"></circle>
                        <circle cx="165" cy="108" r="6" fill="#ef4444" opacity="0.35"></circle>
                        <!-- confident set mouth -->
                        <path id="mouth" d="M130 112 Q 140 115 150 112" stroke="#2c2e2a" stroke-width="3.2" stroke-linecap="round" fill="none"></path>
                    </g>
                </g>

                <!-- Right arm thrust up, bolt charging -->
                <g id="arm-right" transform-origin="160 160">
                    <rect x="160" y="150" width="24" height="80" rx="12" fill="#7cc44f" transform="rotate(-48 160 150)"></rect>
                    <circle cx="222" cy="98" r="16" fill="#f4c542"></circle>
                    <!-- charge ring around the bolt -->
                    <circle id="charge-ring" cx="228" cy="66" r="30" fill="none" stroke="#f4c542" stroke-width="2.5" opacity="0"></circle>
                    <g id="the-bolt" filter="url(#bolt-glow)">
                        <path d="M232 28 L212 68 h20 L217 118 L252 58 h-20 L242 28 Z" fill="url(#bolt-grad)"></path>
                    </g>
                </g>

                <g id="spark-layer" pointer-events="none"></g>
            </svg>
        </div>

        <div id="status-text" class="mt-8 text-sm font-medium text-[#4a7a2e] opacity-0 transition-opacity duration-300" data-sd-id="10">
            Let's fight this.
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wrapper = document.getElementById('mascot-wrapper');
            const svg = document.getElementById('mascot-svg');
            const bodyGroup = document.getElementById('mascot-body-group');
            const rightArm = document.getElementById('arm-right');
            const bolt = document.getElementById('the-bolt');
            const cape = document.getElementById('cape');
            const headGroup = document.getElementById('head-group');
            const eyeLeft = document.getElementById('eye-left');
            const eyeRight = document.getElementById('eye-right');
            const chargeRing = document.getElementById('charge-ring');
            const sparkLayer = document.getElementById('spark-layer');
            const statusText = document.getElementById('status-text');
            const SVGNS = "http://www.w3.org/2000/svg";
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            gsap.set(wrapper, { transformOrigin: "center bottom" });
            gsap.set(rightArm, { transformOrigin: "30% 90%" });
            gsap.set(bodyGroup, { transformOrigin: "50% 100%" });
            gsap.set(cape, { transformOrigin: "140px 120px" });
            gsap.set(headGroup, { transformOrigin: "140px 140px" });
            gsap.set(bolt, { transformOrigin: "center center" });
            gsap.set(chargeRing, { transformOrigin: "228px 66px" });
            gsap.set([eyeLeft, eyeRight], { transformOrigin: "center center" });

            function startAmbient() {
                if (reduceMotion) return;
                // Steady, purposeful idle — a firm float, not bouncy.
                gsap.to(svg, { y: -8, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
                gsap.to(bodyGroup, { scale: 1.015, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: -1 });
                gsap.to(cape, { rotation: 3, skewX: -2, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: -1, delay: 0.2 });
                // The bolt actively "charges": brighter, faster pulse + expanding charge rings.
                gsap.to(bolt, { scale: 1.14, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: -1 });
                emitChargeRing();
                scheduleBlink();
            }
            function emitChargeRing() {
                if (reduceMotion) return;
                gsap.fromTo(chargeRing, { scale: 0.4, opacity: 0.7 }, {
                    scale: 1.3, opacity: 0, duration: 1.2, ease: "power1.out",
                    onComplete: () => gsap.delayedCall(0.5, emitChargeRing)
                });
            }
            function scheduleBlink() {
                if (reduceMotion) return;
                gsap.to([eyeLeft, eyeRight], { scaleY: 0.1, duration: 0.08, ease: "power1.inOut",
                    yoyo: true, repeat: 1, delay: gsap.utils.random(2.5, 5), onComplete: scheduleBlink });
            }

            if (reduceMotion) {
                gsap.set(wrapper, { scale: 1, y: 0, opacity: 1 });
                gsap.to(statusText, { opacity: 1, duration: 0.3 });
                startAmbient();
            } else {
                gsap.from(wrapper, { duration: 1.0, scale: 0.3, y: 40, opacity: 0, ease: "back.out(1.6)", delay: 0.25,
                    onComplete: () => { startAmbient(); gsap.to(statusText, { opacity: 1, duration: 0.5 }); } });
            }

            wrapper.addEventListener('mouseenter', () => {
                gsap.to(wrapper, { scale: 1.08, duration: 0.35, ease: "back.out(1.5)" });
                gsap.to(headGroup, { rotation: -4, duration: 0.3, ease: "power2.out" });
                gsap.to(bolt, { filter: "drop-shadow(0px 0px 18px rgba(244, 197, 66, 0.95))", duration: 0.3 });
                statusText.innerText = "I've got your back.";
                statusText.classList.add('text-[#ef4444]'); statusText.classList.remove('text-[#4a7a2e]');
            });
            wrapper.addEventListener('mouseleave', () => {
                gsap.to(wrapper, { scale: 1, duration: 0.35, ease: "power2.out" });
                gsap.to(headGroup, { rotation: 0, duration: 0.4, ease: "elastic.out(1, 0.5)" });
                gsap.to(bolt, { filter: "none", duration: 0.3 });
                statusText.innerText = "Let's fight this.";
                statusText.classList.remove('text-[#ef4444]'); statusText.classList.add('text-[#4a7a2e]');
            });

            function boltDischarge() {
                if (reduceMotion) return;
                const cx = 232, cy = 58, count = 9;
                for (let i = 0; i < count; i++) {
                    const s = document.createElementNS(SVGNS, "circle");
                    s.setAttribute("cx", cx); s.setAttribute("cy", cy);
                    s.setAttribute("r", gsap.utils.random(2, 4));
                    s.setAttribute("fill", i % 2 ? "#fde047" : "#ffffff");
                    sparkLayer.appendChild(s);
                    const angle = (i / count) * Math.PI * 2, dist = gsap.utils.random(40, 80);
                    gsap.fromTo(s, { opacity: 1, scale: 1, transformOrigin: "center center" },
                        { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist, opacity: 0, scale: 0.2,
                          duration: gsap.utils.random(0.5, 0.85), ease: "power2.out", onComplete: () => s.remove() });
                }
            }

            // Click = a decisive "power up" — thrust the bolt higher, big flash + discharge.
            wrapper.addEventListener('click', () => {
                if (gsap.isTweening(rightArm)) return;
                const tl = gsap.timeline();
                tl.to(rightArm, { rotation: 10, duration: 0.15, ease: "power1.out" })
                  .to(rightArm, { rotation: -8, duration: 0.5, ease: "elastic.out(1, 0.4)" });
                gsap.to(wrapper, { keyframes: [
                    { y: -14, scaleY: 1.04, duration: 0.18, ease: "power2.out" },
                    { y: 0, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }
                ]});
                if (!reduceMotion) gsap.fromTo(cape, { rotation: 0 }, { rotation: -10, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 });
                tl.add(() => {
                    gsap.fromTo(bolt, { filter: "brightness(2.4) drop-shadow(0px 0px 34px rgba(255,255,255,1))" }, { filter: "none", duration: 0.9, ease: "power2.out" });
                    gsap.fromTo(bolt, { scale: 1.4 }, { scale: 1.14, duration: 0.6, ease: "elastic.out(1, 0.45)" });
                    boltDischarge();
                }, 0.18);
                statusText.innerText = "Powering up your case!";
                gsap.delayedCall(2, () => { statusText.innerText = "Let's fight this."; });
            });
        });
    </script>
</body></html>
